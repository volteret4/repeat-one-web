<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mapa de Discos (simulación)</title>
<link rel="stylesheet" href="sim.css">
<style>
:root{--bg:#141a30;--surface:#1c2340;--border:#343c63;--accent:#8ea2ff;--on:#0b1030;--max:1300px}
svg{width:100%;height:70vh;background:var(--surface);border:1px solid var(--border);border-radius:6px}.n{cursor:pointer}.n text{font-size:12px;fill:#e8eaf6;paint-order:stroke;stroke:#141a30;stroke-width:3px}</style>
<script src="sim.js"></script>
</head>
<body data-mod="mapa">
<div class="sim-wrap">
<div class="row" style="margin-bottom:.6rem"><h1 style="margin:0">Mapa de Discos</h1><input id="q" list="al" placeholder="Busca un artista…" style="flex:1"><datalist id="al"></datalist><span class="small muted">● lo tienes ○ te falta ◆ género — pulsa un nodo</span></div><svg id="m" viewBox="0 0 900 560" role="img" aria-label="Grafo de artista, discos y géneros"></svg>
</div>
<script>
const NS='http://www.w3.org/2000/svg';let cur=0;function node(x,y,t,k,fn){return `<g class="n" onclick="${fn}"><${k=='g'?'rect':'circle'} ${k=='g'?`x="${x-8}" y="${y-8}" width="16" height="16" transform="rotate(45 ${x} ${y})"`:`cx="${x}" cy="${y}" r="${k=='a'?16:9}"`} fill="${k=='a'?'#8ea2ff':k=='g'?'#e8b04b':k=='h'?'#6fcf97':'none'}" stroke="${k=='m'?'#9aa3c7':'none'}" stroke-width="2"/><text x="${x+14}" y="${y+4}">${t}</text></g>`}
function r(){const a=SIM.albums[cur],cx=420,cy=280;let s='',ls='';const pts=[];for(let i=0;i<6;i++){const an=i/6*6.283;pts.push([cx+Math.cos(an)*200,cy+Math.sin(an)*180,`${a.title} ${i?i+1:''}`,i%3==2?'m':'h',"SIM.toast('Simulación: aquí se abriría la ficha del disco.')"])}
SIM.genres.slice(0,2).forEach((g,i)=>{const o=SIM.albums[(cur+i+1)%12];pts.push([cx+(i?300:-300),cy-(i?200:-210),g,'g',`cur=${(cur+i+1)%12};r()`]);});
pts.forEach(p=>ls+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#343c63"/>`);pts.forEach(p=>s+=node(...p));document.getElementById('m').innerHTML=ls+s+node(cx,cy,SIM.esc(a.artist),'a','');}
document.getElementById('al').innerHTML=SIM.artists.map(x=>`<option value="${x}">`).join('');document.getElementById('q').oninput=e=>{const i=SIM.artists.indexOf(e.target.value);if(i>=0){cur=i;r()}};r();
</script>
</body>
</html>
