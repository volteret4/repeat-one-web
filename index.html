<title>REPEAT-ONE: herramientas para escuchar música con calma</title>
<meta name="description" content="Índice público de REPEAT-ONE: prueba cada módulo y aprende a instalarlo en tu propio servidor.">

<body>
<div class="wrap">
<header class="top">
<svg class="glyph" viewBox="0 0 48 48" aria-hidden="true"><path d="M36 14H15a8 8 0 0 0-8 8v2M12 34h21a8 8 0 0 0 8-8v-2M31 9l5 5-5 5M17 29l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="28.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">1</text></svg>
<div>
<h1>REPEAT-ONE</h1>
<p class="lead">Herramientas para encontrar, ordenar y escuchar música. Pulsa un módulo para saber qué hace, probarlo e instalarlo en tu servidor.</p>
</div>
</header>
<div class="filters" role="group" aria-label="Filtrar módulos">
<button type="button" class="chip active" data-filter="all" aria-pressed="true">Todos <span id="n-all"></span></button>
<button type="button" class="chip" data-filter="public" aria-pressed="false"><span class="dot public"></span>Versión pública <span id="n-public"></span></button>
<button type="button" class="chip" data-filter="sim" aria-pressed="false"><span class="dot sim"></span>Simulación <span id="n-sim"></span></button>
</div>
<main id="groups"></main>
<footer>
<p>Las simulaciones usan datos inventados. Las versiones públicas guardan lo tuyo en tu navegador o no guardan nada.</p>
<p><a href="https://github.com/volteret4/repeat-one-web#instalación" target="_blank" rel="noopener">Instalar REPEAT-ONE eligiendo módulos ↗</a></p>
</footer>
</div>
<div id="scrim" class="scrim" hidden></div>
<aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" tabindex="-1" hidden>
